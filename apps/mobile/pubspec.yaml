name: easylife_mobile
description: EasyLife — Everyday Problems. Smarter Solutions. Flutter mobile application for Android and iOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  shared_preferences_android: 2.4.10

flutter:
  uses-material-design: true
  fonts:
    - family: General Sans
      fonts:
        - asset: assets/fonts/GeneralSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeneralSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeneralSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/GeneralSans-Bold.ttf
          weight: 700
